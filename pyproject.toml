[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-web-scraper"
version = "0.1.0"
description = "Resilient, scalable, intelligent web scraping platform (see sd.txt)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "PyYAML>=6.0",
    "structlog>=24.1",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
queue = ["celery>=5.3", "redis>=5.0"]
postgres = ["asyncpg>=0.29"]
captcha = []  # solvers use plain HTTP (httpx), no extra deps needed
s3 = ["boto3>=1.34"]
all = ["playwright>=1.44", "celery>=5.3", "redis>=5.0", "asyncpg>=0.29", "boto3>=1.34"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
uwscraper = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "browser: tests requiring a Playwright browser installation",
]

[tool.ruff]
line-length = 110
target-version = "py311"
