apiVersion: apps/v1
kind: Deployment
metadata:
  name: uws-api
  labels: {app: uws-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: uws-api}
  template:
    metadata:
      labels: {app: uws-api}
    spec:
      containers:
        - name: api
          image: universalwebscraper/api:latest
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: uws-config}
            - secretRef: {name: uws-secrets}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: uws-api
spec:
  selector: {app: uws-api}
  ports:
    - port: 80
      targetPort: 8000
